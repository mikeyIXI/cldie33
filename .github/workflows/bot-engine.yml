name: CloudForge 24/7 Bot Engine

on:
  workflow_dispatch:
    inputs:
      max_runtime_sec:
        description: "Max runtime in seconds before seamless self-renewal"
        required: false
        default: "20700"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

jobs:
  engine:
    name: CloudForge Telegram Bot
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check if Bot Engine is already running (with Zombie Heartbeat Recovery)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CUR_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_start=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import calendar, json, os, subprocess, time

          repo = os.environ["REPO"]
          cur_id = int(os.environ["CUR_RUN_ID"])
          out_file = os.environ["GITHUB_OUTPUT"]
          now = int(time.time())

          def gh_json(args):
              r = subprocess.run(["gh", "api"] + args, capture_output=True, text=True)
              if r.returncode != 0 or not r.stdout.strip():
                  return {}
              try:
                  return json.loads(r.stdout)
              except Exception:
                  return {}

          def parse_ts(s):
              if not s or len(s) < 19:
                  return now
              try:
                  return int(calendar.timegm(time.strptime(s[:19], "%Y-%m-%dT%H:%M:%S")))
              except Exception:
                  return now

          runs_data = gh_json([f"repos/{repo}/actions/workflows/bot-engine.yml/runs?per_page=15"])
          others = [
              w for w in runs_data.get("workflow_runs", [])
              if int(w.get("id") or 0) != cur_id
              and (w.get("status") == "in_progress" or (w.get("status") == "queued" and w.get("event") == "workflow_dispatch"))
          ]
          if not others:
              print("No active BotEngine runs found — starting fresh instance.")
              with open(out_file, "a") as f:
                  f.write("should_start=true\n")
              raise SystemExit(0)

          all_old = all((now - parse_ts(w.get("run_started_at") or w.get("created_at"))) > 600 for w in others)
          stale_hb = False
          if all_old:
              rel = gh_json([f"repos/{repo}/releases/tags/cloudbot-state"])
              for a in rel.get("assets", []):
                  if a.get("name") == "cloudbot.db.enc":
                      hb_age = now - parse_ts(a.get("updated_at"))
                      print(f"cloudbot.db.enc heartbeat age: {hb_age}s")
                      if hb_age > 900:
                          stale_hb = True
                      break

          if all_old and stale_hb:
              print(f"Detected zombie BotEngine run(s) {[w['id'] for w in others]} (DB heartbeat >900s stale) — cancelling & recovering!")
              for w in others:
                  subprocess.run(["gh", "api", "-X", "POST", f"repos/{repo}/actions/runs/{w['id']}/cancel"], capture_output=True)
              time.sleep(4)
              with open(out_file, "a") as f:
                  f.write("should_start=true\n")
          else:
              print(f"Healthy active BotEngine run(s) {[w['id'] for w in others]} — skipping scheduled start.")
              with open(out_file, "a") as f:
                  f.write("should_start=false\n")
          PY

      - name: Checkout Encrypted Vault
        if: steps.check.outputs.should_start == 'true'
        uses: actions/checkout@v4

      - name: Start CloudForge 24/7 Bot Service
        if: steps.check.outputs.should_start == 'true'
        env:
          CLOUDBOT_VAULT_KEY: ${{ secrets.CLOUDBOT_VAULT_KEY }}
          CLOUDBOT_VAULT_KEY_PREV: ${{ secrets.CLOUDBOT_VAULT_KEY_PREV }}
          CLOUDBOT_TOKEN: ${{ secrets.CLOUDBOT_TOKEN }}
          CLOUDBOT_OWNER_ID: ${{ secrets.CLOUDBOT_OWNER_ID }}
          CLOUDBOT_DB_KEY: ${{ secrets.CLOUDBOT_DB_KEY }}
          CLOUDBOT_DB_KEY_V2: ${{ secrets.CLOUDBOT_DB_KEY_V2 }}
          NODE_CLUSTER_SECRET: ${{ secrets.NODE_CLUSTER_SECRET }}
          NODE_VAULT_KEY: ${{ secrets.NODE_VAULT_KEY }}
          NODE_VAULT_KEY_PREV: ${{ secrets.NODE_VAULT_KEY_PREV }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
          BOT_MAX_RUNTIME_SEC: ${{ inputs.max_runtime_sec || '20700' }}
        run: |
          exec python3 -u - <<'PY'
          import hashlib, hmac, json, os, shutil, sys, tempfile, zlib

          vkeys = [
              k for k in (
                  os.environ.pop("CLOUDBOT_VAULT_KEY", "").strip(),
                  os.environ.pop("CLOUDBOT_VAULT_KEY_PREV", "").strip(),
              ) if k
          ]
          with open("engine/core.vault", "rb") as f:
              blob = f.read()
          if len(blob) < 52 or blob[:4] != b"CFV1":
              raise RuntimeError("Invalid core.vault header")
          salt, tag, ct = blob[4:20], blob[20:52], blob[52:]
          dk = None
          for cand in vkeys:
              cand_dk = hashlib.pbkdf2_hmac("sha512", cand.encode("utf-8"), salt, 250_000, dklen=64)
              if hmac.compare_digest(tag, hmac.new(cand_dk[32:], b"CFV1" + salt + ct, hashlib.sha256).digest()):
                  dk = cand_dk
                  break
          if dk is None:
              raise RuntimeError("core.vault integrity verification failed")
          ks = hashlib.shake_256(dk[:32] + salt).digest(len(ct))
          modules = json.loads(zlib.decompress(bytes(a ^ b for a, b in zip(ct, ks))).decode("utf-8"))
          del vkeys, dk, ks, blob

          shm_base = "/dev/shm" if os.path.isdir("/dev/shm") else None
          pkg_root = tempfile.mkdtemp(prefix=".cf_pkg_", dir=shm_base)
          os.chmod(pkg_root, 0o700)
          bot_dir = os.path.join(pkg_root, "bot")
          os.makedirs(bot_dir, mode=0o700, exist_ok=True)
          for mod_name, src in modules.items():
              fname = "__init__.py" if mod_name == "bot" else f"{mod_name.split('.', 1)[1]}.py"
              with open(os.path.join(bot_dir, fname), "w", encoding="utf-8") as mf:
                  mf.write(src)
          del modules

          sys.path.insert(0, pkg_root)
          try:
              import bot.config
              import bot.database
              import bot.tg_api
              import bot.keyboards
              import bot.provisioner
              import bot.handlers
              import bot.main as bot_main
          finally:
              shutil.rmtree(pkg_root, ignore_errors=True)
              if pkg_root in sys.path:
                  sys.path.remove(pkg_root)

          raise SystemExit(bot_main.main())
          PY
