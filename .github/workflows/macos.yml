name: macOS Genuine Edition (Screen Sharing + Bore)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password for macOS login & VNC (default: Mikey@2026)'
        required: false
        default: 'Mikey@2026'
      auto_restart:
        description: 'Auto-restart workflow before timeout (6h)'
        required: false
        type: boolean
        default: false

concurrency:
  group: vexor-macos-native
  cancel-in-progress: true

jobs:
  macos-desktop:
    name: Run Genuine macOS Desktop
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Diagnostics & Information
        run: |
          echo "======================================================"
          echo " macOS Runner System Information"
          echo "======================================================"
          sw_vers
          uname -a
          sysctl machdep.cpu.brand_string || true
          sysctl hw.memsize || true

      - name: Activate Native Virtual Display (Fix Black Screen)
        run: |
          echo "======================================================"
          echo " Compiling & Activating CGVirtualDisplay Daemon"
          echo "======================================================"
          # Compile native Objective-C daemon that attaches an active 1920x1080 display
          # to WindowServer so macOS allocates a real framebuffer and stops black screen
          clang -fobjc-arc -framework Cocoa -framework CoreGraphics virtual_display.m -o virtual_display
          chmod +x virtual_display
          ./virtual_display > /tmp/virtual_display.log 2>&1 &
          sleep 3

          # Apply VMware tools resolution if available
          if [ -f "/Library/Application Support/VMware Tools/vmware-resolutionSet" ]; then
            echo "[*] Setting VMware display resolution to 1920x1080..."
            "/Library/Application Support/VMware Tools/vmware-resolutionSet" 1920 1080 || true
          fi

          # Disable screen/system sleep and wake display
          echo "[*] Configuring power management to prevent sleep..."
          sudo pmset -a displaysleep 0 disksleep 0 sleep 0 2>/dev/null || true
          caffeinate -d -i -m -u &
          cat /tmp/virtual_display.log || true

      - name: Configure macOS Screen Sharing & Authentication
        env:
          MAC_PASSWORD: ${{ inputs.password || 'Mikey@2026' }}
        run: |
          echo "======================================================"
          echo " Configuring macOS Users & Screen Sharing (ARDAgent)"
          echo "======================================================"
          set -e

          # Set password for runner and root
          echo "[*] Updating runner and root passwords..."
          sudo dscl . -passwd /Users/runner "$MAC_PASSWORD"
          sudo dscl . -passwd /Users/root "$MAC_PASSWORD"

          # Configure auto-login for user runner
          echo "[*] Configuring auto-login for runner..."
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser runner

          # Generate legacy VNC password hash for compatibility with standard VNC clients
          echo "[*] Generating VNC legacy password..."
          echo -n "$MAC_PASSWORD" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt
          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.txt

          # Configure Apple Remote Management / Screen Sharing via kickstart
          echo "[*] Activating Apple Remote Desktop Agent..."
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure -allowAccessFor -allUsers -privs -all \
            -configure -clientopts -setvnclegacy -vnclegacy yes \
            -configure -clientopts -setmenuextra -menuextra yes \
            -restart -agent -console

          # Verify VNC listening on port 5900
          sleep 2
          netstat -an | grep 5900 || true

      - name: Setup Bore Tunnel & Web noVNC Proxy
        run: |
          echo "======================================================"
          echo " Installing Bore Tunnel & noVNC Web Gateway"
          echo "======================================================"
          
          # Install Bore CLI
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-aarch64-apple-darwin.tar.gz | tar -xz
          else
            curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-apple-darwin.tar.gz | tar -xz
          fi
          sudo mv bore /usr/local/bin/bore
          chmod +x /usr/local/bin/bore

          # Setup noVNC (allows running macOS GUI directly in web browser!)
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc
          git clone --depth 1 https://github.com/novnc/websockify /tmp/novnc/utils/websockify
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 > /tmp/novnc.log 2>&1 &
          sleep 3

      - name: Launch Bore Tunnels & Generate Credentials
        id: tunnels
        env:
          MAC_PASSWORD: ${{ inputs.password || 'Mikey@2026' }}
        run: |
          echo "======================================================"
          echo " Starting Bore Public Tunnels"
          echo "======================================================"

          # Tunnel 1: Raw VNC Port 5900 (for RealVNC Viewer, TigerVNC, Remmina, Mac Screen Sharing)
          bore local 5900 --to bore.pub > /tmp/bore_vnc.log 2>&1 &
          
          # Tunnel 2: Web noVNC Port 6080 (for Browser Access)
          bore local 6080 --to bore.pub > /tmp/bore_web.log 2>&1 &

          # Wait for ports to be assigned
          for i in {1..30}; do
            VNC_LINE=$(grep -oE "listening at bore.pub:[0-9]+" /tmp/bore_vnc.log || true)
            WEB_LINE=$(grep -oE "listening at bore.pub:[0-9]+" /tmp/bore_web.log || true)
            if [ -n "$VNC_LINE" ] && [ -n "$WEB_LINE" ]; then
              break
            fi
            sleep 1
          done

          VNC_PORT=$(echo "$VNC_LINE" | cut -d: -f2)
          WEB_PORT=$(echo "$WEB_LINE" | cut -d: -f2)

          echo "VNC_PORT=$VNC_PORT" >> $GITHUB_ENV
          echo "WEB_PORT=$WEB_PORT" >> $GITHUB_ENV

          # Generate connection details file
          mkdir -p connection-details
          cat << 'EOF' > connection-details/CREDENTIALS.md
          # 🍏 Genuine Apple macOS Remote Desktop Access

          ## 🌐 1. Direct Web Browser Access (noVNC - No App Required):
          Open this link in any browser (Chrome / Safari / Edge / Phone):
          ```
          EOF

          echo "http://bore.pub:${WEB_PORT}/vnc.html?host=bore.pub&port=${WEB_PORT}&autoconnect=true" >> connection-details/CREDENTIALS.md

          cat << 'EOF' >> connection-details/CREDENTIALS.md
          ```
          - Password: `${MAC_PASSWORD}`

          ---

          ## 💻 2. VNC Client Access (RealVNC Viewer / TigerVNC / Remmina):
          ```
          EOF

          echo "Host / Address : bore.pub:${VNC_PORT}" >> connection-details/CREDENTIALS.md
          echo "Username       : runner" >> connection-details/CREDENTIALS.md
          echo "Password       : ${MAC_PASSWORD}" >> connection-details/CREDENTIALS.md

          cat << 'EOF' >> connection-details/CREDENTIALS.md
          ```

          > [!NOTE]
          > - **Recommended client:** **RealVNC Viewer** (Free for Windows, Android, iOS, Linux, Mac).
          > - In RealVNC Viewer: set Encryption to **"Let VNC Server Choose"** or **"Prefer Off"** if asked.
          > - You can also open the Web Link directly on your phone or PC!
          EOF

          # Display in logs
          echo "=========================================================="
          echo " macOS REMOTE DESKTOP READY!"
          echo "=========================================================="
          cat connection-details/CREDENTIALS.md
          echo "=========================================================="

      - name: Upload Connection Details Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-connection-info
          path: connection-details/
          retention-days: 1

      - name: Keep macOS Session Alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_RESTART: ${{ inputs.auto_restart }}
        run: |
          echo "======================================================"
          echo " macOS Session is active. Monitoring tunnels..."
          echo "======================================================"

          START_TIME=$(date +%s)
          MAX_DURATION=$(( 350 * 60 )) # 350 minutes (~5.8 hours)

          while true; do
            NOW=$(date +%s)
            ELAPSED=$(( NOW - START_TIME ))

            if [ $ELAPSED -ge $MAX_DURATION ]; then
              echo "[!] Approaching 6-hour GitHub Actions execution limit."
              if [ "$AUTO_RESTART" = "true" ]; then
                echo "[*] Triggering automated continuation workflow..."
                gh workflow run macos.yml --ref main || true
              fi
              break
            fi

            # Check if tunnels are alive
            if ! pgrep -f "bore local" > /dev/null; then
              echo "[!] Bore tunnel exited, restarting..."
              bore local 5900 --to bore.pub >> /tmp/bore_vnc.log 2>&1 &
              bore local 6080 --to bore.pub >> /tmp/bore_web.log 2>&1 &
            fi

            sleep 60
          done
