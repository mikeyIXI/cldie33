name: macOS Genuine Edition (Screen Sharing + Bore)

# Black-screen fix based on a proven solution (actions/runner-images#9529,
# huajideshutiao/legado ios-remote.yml): the runner image does not grant the
# Screen Sharing service Screen-Recording / PostEvent / Accessibility in TCC,
# so VNC authenticates but streams a black framebuffer. We write those grants
# into the system TCC.db at runtime, never touch the runner's GUI session
# (no password reset / auto-login / virtual display), and verify a real frame
# through VNC before publishing the links.

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'VNC password (first 8 chars are used by VNC, default: Mikey@2026)'
        required: false
        default: 'Mikey@2026'
      auto_restart:
        description: 'Auto-restart workflow before timeout (6h)'
        required: false
        type: boolean
        default: false

concurrency:
  group: vexor-macos-native
  cancel-in-progress: true

jobs:
  macos-desktop:
    name: Run Genuine macOS Desktop
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      MAC_PASSWORD: ${{ inputs.password || 'Mikey@2026' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Diagnostics & GUI Session Check
        run: |
          sw_vers; uname -m
          sysctl -n machdep.cpu.brand_string || true
          echo "RAM: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          csrutil status || true
          CONSOLE_USER="$(scutil <<< 'show State:/Users/ConsoleUser' | awk '/Name :/ { print $3 }')"
          LOCKED="$(/usr/libexec/PlistBuddy -c 'print :IOConsoleUsers:0:CGSSessionScreenIsLocked' /dev/stdin 2>/dev/null <<< "$(ioreg -n Root -d1 -a)" || true)"
          echo "Console user : ${CONSOLE_USER:-<none>}"
          echo "Screen locked: ${LOCKED:-false}"
          echo "CONSOLE_USER=$CONSOLE_USER" >> "$GITHUB_ENV"
          if [ -z "$CONSOLE_USER" ] || [ "$CONSOLE_USER" = "loginwindow" ] || [ "$LOCKED" = "true" ]; then
            echo "::error::GUI session is not on the desktop (loginwindow/locked). Re-run the workflow."
            exit 1
          fi

          # Keep the desktop awake and unlocked for the whole session
          sudo -u "$CONSOLE_USER" defaults -currentHost write com.apple.screensaver idleTime -int 0
          sudo -u "$CONSOLE_USER" defaults -currentHost write com.apple.screensaver askForPassword -int 0
          sudo defaults write /Library/Preferences/com.apple.loginwindow DisableScreenLockImmediate -bool true
          sudo systemsetup -setcomputersleep Never -setdisplaysleep Never || true
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true
          nohup caffeinate -dimsu > /dev/null 2>&1 &

      - name: Grant Screen Sharing TCC Permissions (Black Screen Fix)
        run: |
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          # Named-column insert: macOS 14+ added extra columns, positional VALUES would break
          COLS="service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified"
          for CLIENT in \
            "com.apple.screensharing.agent|0" \
            "com.apple.screensharing|0" \
            "com.apple.RemoteDesktopAgent|0" \
            "/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/MacOS/ARDAgent|1" \
            "/System/Library/CoreServices/RemoteManagement/ScreensharingAgent.bundle/Contents/MacOS/ScreensharingAgent|1" \
            "/System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/MacOS/screensharingd|1"; do
            NAME="${CLIENT%|*}"; TYPE="${CLIENT##*|}"
            for SVC in kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceAccessibility kTCCServiceListenEvent; do
              sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access($COLS) VALUES('$SVC','$NAME',$TYPE,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));" || true
            done
          done
          sudo sqlite3 "$DB" "SELECT service,client,auth_value FROM access WHERE client LIKE '%screensharing%' OR client LIKE '%ARDAgent%' OR client LIKE '%RemoteDesktop%';"
          sudo killall tccd || true

      - name: Enable Apple Screen Sharing (VNC)
        run: |
          dscl . -read /Users/$CONSOLE_USER RealName UniqueID 2>/dev/null || true
          # macOS shows its lock screen to VNC-password viewers; give the console
          # account a known password so it can be unlocked from the viewer.
          sudo sysadminctl -resetPasswordFor "$CONSOLE_USER" -newPassword "$MAC_PASSWORD" 2>&1 | grep -v -- "----" || true
          dscl . -authonly "$CONSOLE_USER" "$MAC_PASSWORD" && echo "Console user password set OK" || echo "::warning::console password check failed"
          # Extra admin account for clients that ask for username (ARD auth)
          sudo sysadminctl -addUser mikey -fullName "Mikey" -password "$MAC_PASSWORD" -admin 2>&1 | grep -v -- "----" || true

          # Skip Setup Assistant (Apple ID / "Create account" screens) for mikey so the
          # first login goes straight to the desktop with no Apple account needed.
          sudo touch /var/db/.AppleSetupDone
          MH=/Users/mikey
          sudo mkdir -p "$MH/Library/Preferences"
          VER=$(sw_vers -productVersion); BLD=$(sw_vers -buildVersion)
          SA="$MH/Library/Preferences/com.apple.SetupAssistant"
          for K in DidSeeCloudSetup DidSeeSiriSetup DidSeeApplePaySetup DidSeeAvatarSetup DidSeeAccessibility DidSeeScreenTimeSetup DidSeeTouchIDSetup DidSeeTrueTone DidSeeActivationLock DidSeePrivacy DidSeeSyncSetup DidSeeSyncSetup2 DidSeeAppearanceSetup DidSeeIntelligence GestureMovieSeen; do
            sudo defaults write "$SA" "$K" -bool true
          done
          sudo defaults write "$SA" LastSeenCloudProductVersion -string "$VER"
          sudo defaults write "$SA" LastSeenBuddyBuildVersion -string "$BLD"
          sudo defaults write "$SA" LastPreLoginTasksPerformedVersion -string "$VER"
          sudo chown -R mikey:staff "$MH/Library" 2>/dev/null || sudo chown -R mikey "$MH/Library" || true

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$MAC_PASSWORD" \
            -restart -agent -console

          for _ in $(seq 1 20); do
            sudo lsof -nP -iTCP:5900 -sTCP:LISTEN > /dev/null 2>&1 && break
            sleep 2
          done
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || { echo "::error::Screen Sharing not listening on 5900"; exit 1; }

      - name: Performance Tuning (no animations, cursor, low CPU)
        run: |
          # The runner has no GPU, so every animation/blur is software-rendered and shows as lag
          # over VNC. Turn them off for both the console user and mikey.
          for U in "$CONSOLE_USER" mikey; do
            id "$U" >/dev/null 2>&1 || continue
            D="sudo -u $U defaults"
            $D write NSGlobalDomain NSAutomaticWindowAnimationsEnabled -bool false
            $D write NSGlobalDomain NSWindowResizeTime -float 0.001
            $D write NSGlobalDomain NSScrollAnimationEnabled -bool false
            $D write NSGlobalDomain NSDocumentRevisionsWindowTransformAnimation -bool false
            $D write NSGlobalDomain NSToolbarFullScreenAnimationDuration -float 0
            $D write NSGlobalDomain QLPanelAnimationDuration -float 0
            $D write NSGlobalDomain NSBrowserColumnAnimationSpeedMultiplier -float 0
            $D write NSGlobalDomain com.apple.springing.delay -float 0
            $D write com.apple.universalaccess reduceMotion -bool true
            $D write com.apple.universalaccess reduceTransparency -bool true
            $D write com.apple.dock launchanim -bool false
            $D write com.apple.dock mineffect -string scale
            $D write com.apple.dock expose-animation-duration -float 0
            $D write com.apple.dock springboard-show-duration -float 0
            $D write com.apple.dock springboard-hide-duration -float 0
            $D write com.apple.dock autohide-time-modifier -float 0
            $D write com.apple.dock autohide-delay -float 0
            $D write com.apple.finder DisableAllAnimations -bool true
            $D write com.apple.Accessibility ReduceMotionEnabled -int 1
          done
          sudo killall Dock Finder 2>/dev/null || true
          # Background CPU hogs on a 3-core VM
          sudo mdutil -a -i off 2>/dev/null || true
          sudo launchctl bootout system/com.apple.metadata.mds 2>/dev/null || true
          for A in com.apple.photoanalysisd com.apple.mediaanalysisd com.apple.suggestd com.apple.knowledge-agent com.apple.biomesyncd; do
            sudo launchctl bootout gui/$(id -u "$CONSOLE_USER")/$A 2>/dev/null || true
          done
          sudo pkill -x photoanalysisd 2>/dev/null || true
          sudo pkill -x mediaanalysisd 2>/dev/null || true
          sudo pkill -x softwareupdated 2>/dev/null || true

      - name: Verify Real Desktop Frame Through VNC
        run: |
          mkdir -p connection-details
          exec > >(tee -a connection-details/diag.log) 2>&1
          sleep 2
          python3 -m venv /tmp/vncvenv
          /tmp/vncvenv/bin/pip install -q pycryptodome pillow websockify
          screencapture -x connection-details/1_local_screen.png || true
          echo "== Quick VNC Frame Verification =="
          perl -e 'alarm(35);exec(@ARGV)' /tmp/vncvenv/bin/python vnc_check.py vnc "$MAC_PASSWORD" connection-details/2_vnc_password.png || true

      - name: Install & Start RustDesk (fast H.264/VP9 remote, full mouse/keyboard)
        run: |
          mkdir -p connection-details
          exec > >(tee -a connection-details/diag.log) 2>&1
          if [ "$(uname -m)" = "arm64" ]; then A=aarch64; else A=x86_64; fi
          for i in 1 2 3 4 5; do curl -fsSL -o /tmp/rd.dmg "https://github.com/rustdesk/rustdesk/releases/download/1.5.1/rustdesk-1.5.1-${A}.dmg" && break; sleep 10; done
          hdiutil attach -nobrowse -quiet /tmp/rd.dmg -mountpoint /tmp/rdmnt
          sudo cp -R /tmp/rdmnt/RustDesk.app /Applications/
          hdiutil detach -quiet /tmp/rdmnt || true
          sudo xattr -dr com.apple.quarantine /Applications/RustDesk.app || true
          sudo chown -R root:wheel /Applications/RustDesk.app || true
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /Applications/RustDesk.app/Contents/Info.plist)
          UIDN=$(id -u "$CONSOLE_USER")
          echo "Bundle id: $BID | Console UID: $UIDN ($CONSOLE_USER)"

          # Extract real code-signing requirement blob (csreq) for signed bundle TCC matching
          REQ=$(codesign -dr - /Applications/RustDesk.app 2>&1 | awk -F ' => ' '/=>/{print $2}')
          if [ -n "$REQ" ] && csreq -r "$REQ" -b /tmp/rd.csreq 2>/dev/null; then
            CSHEX="X'$(xxd -p /tmp/rd.csreq | tr -d '\n')'"
          else
            CSHEX="NULL"
          fi
          echo "CSREQ blob length: ${#CSHEX}"

          # Grant ScreenCapture, Accessibility, PostEvent & ListenEvent to RustDesk bundles,
          # binaries, AND runner responsible processes so CGEventPost mouse/key events are never dropped
          COLS="service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified"
          NOW=$(date +%s)
          for DB in "/Library/Application Support/com.apple.TCC/TCC.db" "/Users/$CONSOLE_USER/Library/Application Support/com.apple.TCC/TCC.db"; do
            [ -f "$DB" ] || continue
            for BUNDLE in "$BID" "com.carriez.rustdesk" "com.carriez.RustDesk"; do
              for SVC in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent kTCCServiceListenEvent kTCCServiceMicrophone; do
                sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access($COLS) VALUES('$SVC','$BUNDLE',0,2,4,1,$CSHEX,NULL,0,'UNUSED',NULL,0,$NOW);" 2>/dev/null || true
              done
            done
            for BIN in \
              "/Applications/RustDesk.app/Contents/MacOS/RustDesk" \
              "/Applications/RustDesk.app/Contents/MacOS/service" \
              "/opt/hca/hosted-compute-agent" \
              "/usr/local/opt/runner/provisioner/provisioner" \
              "/opt/off/opt/runner/provisioner/provisioner" \
              "/bin/bash" \
              "/usr/bin/osascript" \
              "/usr/bin/python3"; do
              for SVC in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent kTCCServiceListenEvent; do
                sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access($COLS) VALUES('$SVC','$BIN',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$NOW);" 2>/dev/null || true
              done
            done
          done

          # Pre-approve macOS 15+ replayd screen capture prompt so no dialog steals focus
          REPLAY_DIR="/Users/$CONSOLE_USER/Library/Group Containers/group.com.apple.replayd"
          sudo -u "$CONSOLE_USER" mkdir -p "$REPLAY_DIR" || true
          REPLAY_PLIST="$REPLAY_DIR/ScreenCaptureApprovals.plist"
          for KEY in "$BID" "com.carriez.rustdesk" "/Applications/RustDesk.app/Contents/MacOS/RustDesk"; do
            sudo -u "$CONSOLE_USER" defaults write "$REPLAY_PLIST" "$KEY" -date "3024-01-01 00:00:00 +0000" 2>/dev/null || true
          done
          sudo killall tccd cfprefsd 2>/dev/null || true
          sleep 2

          # Write full-control + Direct IP config for both console user and root (synced like install.scpt)
          for CFG in "/Users/$CONSOLE_USER/Library/Preferences/com.carriez.RustDesk" "/var/root/Library/Preferences/com.carriez.RustDesk"; do
            sudo mkdir -p "$CFG"
            printf "password = '%s'\n" "$MAC_PASSWORD" | sudo tee "$CFG/RustDesk.toml" >/dev/null
            sudo tee "$CFG/RustDesk2.toml" >/dev/null <<'TOML'
          [options]
          direct-server = 'Y'
          direct-access-port = '21118'
          access-mode = 'full'
          enable-keyboard = 'Y'
          enable-clipboard = 'Y'
          enable-file-transfer = 'Y'
          enable-tunnel = 'Y'
          verification-method = 'use-permanent-password'
          approve-mode = 'password'
          enable-hwcodec = 'Y'
          allow-remote-config-modification = 'Y'
          enable-audio = 'N'
          show-remote-cursor = 'Y'
          TOML
          done
          sudo chown -R "$CONSOLE_USER":staff "/Users/$CONSOLE_USER/Library/Preferences/com.carriez.RustDesk" || true

          # Disable macOS Application Firewall so incoming local/direct connections are never blocked
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off 2>/dev/null || true

          # Install official RustDesk LaunchDaemon + Aqua LaunchAgent (exact match to install.scpt)
          # Running --server via Aqua LaunchAgent ensures launchd (not runner shell) is the responsible
          # GUI process, enabling full Cocoa main-thread mouse & keyboard event posting.
          sudo tee /Library/LaunchDaemons/com.carriez.RustDesk_service.plist >/dev/null <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>com.carriez.RustDesk_service</string>
              <key>AssociatedBundleIdentifiers</key>
              <string>${BID}</string>
              <key>KeepAlive</key>
              <true/>
              <key>ThrottleInterval</key>
              <integer>1</integer>
              <key>ProgramArguments</key>
              <array>
                  <string>/Applications/RustDesk.app/Contents/MacOS/service</string>
              </array>
              <key>RunAtLoad</key>
              <true/>
              <key>WorkingDirectory</key>
              <string>/Applications/RustDesk.app/Contents/MacOS/</string>
              <key>StandardErrorPath</key>
              <string>/var/log/rustdesk_service.err</string>
              <key>StandardOutPath</key>
              <string>/var/log/rustdesk_service.out</string>
          </dict>
          </plist>
          PLIST
          sudo chown root:wheel /Library/LaunchDaemons/com.carriez.RustDesk_service.plist
          sudo chmod 644 /Library/LaunchDaemons/com.carriez.RustDesk_service.plist

          sudo tee /Library/LaunchAgents/com.carriez.RustDesk_server.plist >/dev/null <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>com.carriez.RustDesk_server</string>
              <key>AssociatedBundleIdentifiers</key>
              <string>${BID}</string>
              <key>LimitLoadToSessionType</key>
              <array>
                  <string>LoginWindow</string>
                  <string>Aqua</string>
              </array>
              <key>KeepAlive</key>
              <dict>
                  <key>SuccessfulExit</key>
                  <false/>
                  <key>AfterInitialDemand</key>
                  <false/>
              </dict>
              <key>ThrottleInterval</key>
              <integer>1</integer>
              <key>RunAtLoad</key>
              <true/>
              <key>ProgramArguments</key>
              <array>
                  <string>/Applications/RustDesk.app/Contents/MacOS/RustDesk</string>
                  <string>--server</string>
              </array>
              <key>WorkingDirectory</key>
              <string>/Applications/RustDesk.app/Contents/MacOS/</string>
              <key>ProcessType</key>
              <string>Interactive</string>
              <key>StandardErrorPath</key>
              <string>/tmp/rustdesk_server.err</string>
              <key>StandardOutPath</key>
              <string>/tmp/rustdesk_server.out</string>
          </dict>
          </plist>
          PLIST
          sudo chown root:wheel /Library/LaunchAgents/com.carriez.RustDesk_server.plist
          sudo chmod 644 /Library/LaunchAgents/com.carriez.RustDesk_server.plist

          sudo launchctl bootout system/com.carriez.RustDesk_service 2>/dev/null || true
          sudo launchctl bootstrap system /Library/LaunchDaemons/com.carriez.RustDesk_service.plist 2>/dev/null || sudo launchctl load -w /Library/LaunchDaemons/com.carriez.RustDesk_service.plist || true

          sudo launchctl bootout "gui/$UIDN/com.carriez.RustDesk_server" 2>/dev/null || true
          sudo launchctl bootstrap "gui/$UIDN" /Library/LaunchAgents/com.carriez.RustDesk_server.plist 2>/dev/null || sudo launchctl asuser "$UIDN" sudo -u "$CONSOLE_USER" launchctl load -w /Library/LaunchAgents/com.carriez.RustDesk_server.plist || true
          sudo launchctl kickstart -k "gui/$UIDN/com.carriez.RustDesk_server" 2>/dev/null || true

          for i in $(seq 1 20); do
            sudo lsof -nP -iTCP:21118 -sTCP:LISTEN >/dev/null 2>&1 && break
            sleep 2
          done

          # Set permanent password via CLI and sync config between user and root
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --password "$MAC_PASSWORD" 2>&1 | tail -2 || true
          sudo -u "$CONSOLE_USER" /Applications/RustDesk.app/Contents/MacOS/RustDesk --password "$MAC_PASSWORD" 2>&1 | tail -2 || true
          sudo cp -f "/Users/$CONSOLE_USER/Library/Preferences/com.carriez.RustDesk/RustDesk.toml" "/var/root/Library/Preferences/com.carriez.RustDesk/RustDesk.toml" 2>/dev/null || true
          sudo chown -R "$CONSOLE_USER":staff "/Users/$CONSOLE_USER/Library/Preferences/com.carriez.RustDesk" || true

          # Open RustDesk main window briefly to verify zero service/permission warnings in screenshot
          sudo launchctl asuser "$UIDN" sudo -u "$CONSOLE_USER" open -a /Applications/RustDesk.app || true
          sleep 5

          echo "=== RustDesk Direct IP Port 21118 Listener & LaunchAgent Status ==="
          sudo lsof -nP -iTCP:21118 -sTCP:LISTEN || true
          sudo launchctl print "gui/$UIDN/com.carriez.RustDesk_server" 2>&1 | head -n 25 || true

          echo "=== Live macOS CGEvent Input Self-Test ==="
          sudo launchctl asuser "$UIDN" sudo -u "$CONSOLE_USER" /usr/bin/python3 - <<'PY' || true
          import ctypes, time
          cg = ctypes.cdll.LoadLibrary('/System/Library/Frameworks/CoreGraphics.framework/CoreGraphics')
          app = ctypes.cdll.LoadLibrary('/System/Library/Frameworks/ApplicationServices.framework/ApplicationServices')
          cg.CGPreflightScreenCaptureAccess.restype = ctypes.c_bool
          cg.CGPreflightPostEventAccess.restype = ctypes.c_bool
          app.AXIsProcessTrusted.restype = ctypes.c_bool
          class CGPoint(ctypes.Structure):
              _fields_ = [('x', ctypes.c_double), ('y', ctypes.c_double)]
          cg.CGEventCreate.argtypes = [ctypes.c_void_p]
          cg.CGEventCreate.restype = ctypes.c_void_p
          cg.CGEventGetLocation.argtypes = [ctypes.c_void_p]
          cg.CGEventGetLocation.restype = CGPoint
          cg.CGEventCreateMouseEvent.argtypes = [ctypes.c_void_p, ctypes.c_uint32, CGPoint, ctypes.c_uint32]
          cg.CGEventCreateMouseEvent.restype = ctypes.c_void_p
          cg.CGEventPost.argtypes = [ctypes.c_uint32, ctypes.c_void_p]
          p0 = cg.CGEventGetLocation(cg.CGEventCreate(None))
          ev = cg.CGEventCreateMouseEvent(None, 5, CGPoint(420.0, 310.0), 0)
          cg.CGEventPost(0, ev)
          time.sleep(0.2)
          p1 = cg.CGEventGetLocation(cg.CGEventCreate(None))
          print(f"ScreenCapture={cg.CGPreflightScreenCaptureAccess()} PostEvent={cg.CGPreflightPostEventAccess()} AXTrusted={app.AXIsProcessTrusted()}")
          print(f"Cursor before=({p0.x:.1f},{p0.y:.1f}) after=({p1.x:.1f},{p1.y:.1f})")
          PY

          RD_ID=""
          for i in $(seq 1 15); do
            RD_ID=$(sudo -u "$CONSOLE_USER" /Applications/RustDesk.app/Contents/MacOS/RustDesk --get-id 2>/dev/null | tr -dc '0-9' )
            [ -z "$RD_ID" ] && RD_ID=$(grep -E "^id *=" "/Users/$CONSOLE_USER/Library/Preferences/com.carriez.RustDesk/RustDesk.toml" 2>/dev/null | grep -oE "[0-9]{6,}" )
            [ -n "$RD_ID" ] && break
            sleep 2
          done
          echo "RustDesk ID: $RD_ID"
          echo "RD_ID=$RD_ID" >> "$GITHUB_ENV"
          screencapture -x connection-details/7_rustdesk_running.png || true
          # Close the RustDesk welcome window so the user lands on a clean desktop ready to use
          osascript -e 'tell application "System Events" to tell process "RustDesk" to click button 1 of window 1' 2>/dev/null || true

      - name: Setup noVNC, Bore & Cloudflare
        run: |
          retry() { for i in 1 2 3 4 5 6; do "$@" && return 0; echo "retry $i: $*"; sleep 10; done; return 1; }
          get_novnc() { rm -rf /tmp/novnc && git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc; }
          retry get_novnc
          nohup /tmp/vncvenv/bin/websockify --web /tmp/novnc 6080 127.0.0.1:5900 > /tmp/websockify.log 2>&1 &
          for _ in $(seq 1 15); do curl -sf -o /dev/null http://127.0.0.1:6080/vnc.html && break; sleep 2; done

          if [ "$(uname -m)" = "arm64" ]; then B=aarch64; C=arm64; else B=x86_64; C=amd64; fi
          retry sh -c "curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-${B}-apple-darwin.tar.gz | tar -xz"
          retry sh -c "curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-${C}.tgz | tar -xz"
          sudo mv bore cloudflared /usr/local/bin/
          sudo chmod +x /usr/local/bin/bore /usr/local/bin/cloudflared

      - name: Launch Tunnels & Generate Credentials
        run: |
          nohup bore local 21118 --to bore.pub > /tmp/bore_rd.log 2>&1 &
          nohup bore local 5900 --to bore.pub > /tmp/bore_vnc.log 2>&1 &
          nohup cloudflared tunnel --protocol http2 --url http://127.0.0.1:6080 > /tmp/cf.log 2>&1 &
          for _ in $(seq 1 40); do
            RD_PORT=$(grep -oE "listening at bore.pub:[0-9]+" /tmp/bore_rd.log | head -1 | cut -d: -f2)
            VNC_PORT=$(grep -oE "listening at bore.pub:[0-9]+" /tmp/bore_vnc.log | head -1 | cut -d: -f2)
            CF_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/cf.log | head -1)
            [ -n "$RD_PORT" ] && [ -n "$VNC_PORT" ] && [ -n "$CF_URL" ] && break
            sleep 1
          done
          BORE_IP=$(python3 -c "import socket; print(socket.gethostbyname('bore.pub'))" 2>/dev/null || echo "bore.pub")
          echo "RD_PORT=$RD_PORT" >> "$GITHUB_ENV"
          echo "VNC_PORT=$VNC_PORT" >> "$GITHUB_ENV"

          cat > connection-details/CREDENTIALS.md <<EOF
          # Genuine Apple macOS Remote Desktop

          ## 0. RustDesk Direct IP (NO ACCOUNT / NO LOGIN NEEDED - FASTEST)
          Enter in Remote ID box: ${BORE_IP}:${RD_PORT}
          (or hostname)         : bore.pub:${RD_PORT}
          Password              : ${MAC_PASSWORD}
          (Optional numeric ID if signed in: ${RD_ID})

          ## 1. Browser (HTTPS, one click)
          ${CF_URL}/vnc.html?autoconnect=true&resize=scale&show_dot=true&quality=5&compression=3

          ## 2. RealVNC Viewer / TigerVNC
          Address : bore.pub:${VNC_PORT}
          Password: ${MAC_PASSWORD}

          Console user: ${CONSOLE_USER}  |  Extra admin user: mikey / ${MAC_PASSWORD}
          EOF
          cat connection-details/CREDENTIALS.md
          cat connection-details/CREDENTIALS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Connection Details & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-connection-info
          path: connection-details/
          retention-days: 1

      - name: Keep macOS Session Alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_RESTART: ${{ inputs.auto_restart }}
        run: |
          UIDN=$(id -u "$CONSOLE_USER")
          END=$(( $(date +%s) + 350 * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            sudo pkill -u mikey -x "Setup Assistant" 2>/dev/null || true
            sudo pkill -u mikey -f "SetupAssistant" 2>/dev/null || true
            if ! sudo lsof -nP -iTCP:21118 -sTCP:LISTEN >/dev/null 2>&1; then
              echo "[!] RustDesk 21118 not listening, kickstarting Aqua LaunchAgent"
              sudo launchctl kickstart -k "gui/$UIDN/com.carriez.RustDesk_server" 2>/dev/null || true
            fi
            if ! pgrep -f "bore local 21118" > /dev/null; then
              echo "[!] bore 21118 died, restarting"
              nohup bore local 21118 --to bore.pub >> /tmp/bore_rd.log 2>&1 &
            fi
            if ! pgrep -f "bore local 5900" > /dev/null; then
              echo "[!] bore died, restarting (port may change)"
              nohup bore local 5900 --to bore.pub >> /tmp/bore_vnc.log 2>&1 &
            fi
            if ! pgrep -f "cloudflared tunnel" > /dev/null; then
              echo "[!] cloudflared died, restarting (URL will change)"
              nohup cloudflared tunnel --protocol http2 --url http://127.0.0.1:6080 > /tmp/cf.log 2>&1 &
              sleep 15; grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/cf.log | head -1
            fi
            sleep 60
          done
          if [ "$AUTO_RESTART" = "true" ]; then
            gh workflow run macos.yml --ref main || true
          fi
