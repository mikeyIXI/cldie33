name: macOS Apple Silicon Cloud Runner

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: 'macOS Version (macos-15 [Sequoia], macos-latest)'
        required: false
        default: 'macos-15'
      password:
        description: 'Password for VNC / SSH'
        required: false
        default: 'Mikey@2026'
      auto_restart:
        description: 'Auto-restart when session ends'
        required: false
        default: 'false'

concurrency:
  group: vexor-macos
  cancel-in-progress: true

jobs:
  macos-runner:
    runs-on: ${{ inputs.macos_version || 'macos-15' }}
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read

    steps:
      # ── 1. Download Bore ───────────────────────────────────────────────────
      - name: Download Bore Tunnel
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-aarch64-apple-darwin.tar.gz" -o bore.tar.gz
          else
            curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-apple-darwin.tar.gz" -o bore.tar.gz
          fi
          tar -xzf bore.tar.gz
          sudo mv bore /usr/local/bin/bore
          sudo chmod +x /usr/local/bin/bore
          rm -f bore.tar.gz
          echo "[+] Bore installed for $ARCH"

      # ── 2. Configure Password, TCC & System ───────────────────────────────
      - name: Configure User and Remote Access
        env:
          RDP_SECRET_PASS: ${{ secrets.RDP_PASS }}
        run: |
          PASS="${{ inputs.password }}"
          PASS=$(echo "$PASS" | xargs)
          [ -z "$PASS" ] && PASS="${RDP_SECRET_PASS}"
          [ -z "$PASS" ] && PASS="Mikey@2026"
          echo "::add-mask::$PASS"
          echo "MAC_PASS=$PASS" >> $GITHUB_ENV

          # 1. Prevent display & system sleep and keep display awake
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 2>/dev/null || true
          sudo pmset -a disablesleep 1 2>/dev/null || true
          defaults -currentHost write com.apple.screensaver idleTime 0 2>/dev/null || true
          sudo defaults write /Library/Preferences/com.apple.screensaver loginWindowIdleTime 0 2>/dev/null || true
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "runner" 2>/dev/null || true
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUserScreenLocked -bool false 2>/dev/null || true
          nohup caffeinate -dimsu &

          # 2. Set runner user password to $PASS so both runner and mikey share identical credentials
          sudo dscl . -passwd /Users/runner "$PASS" 2>/dev/null || true
          echo "runner:$PASS" | sudo chpasswd 2>/dev/null || true
          echo "RUNNER_PASS=$PASS" >> $GITHUB_ENV

          # 3. Create dedicated user 'mikey'
          sudo dscl . -create /Users/mikey 2>/dev/null || true
          sudo dscl . -create /Users/mikey UserShell /bin/zsh 2>/dev/null || true
          sudo dscl . -create /Users/mikey RealName "Mikey" 2>/dev/null || true
          sudo dscl . -create /Users/mikey UniqueID 1001 2>/dev/null || true
          sudo dscl . -create /Users/mikey PrimaryGroupID 80 2>/dev/null || true
          sudo dscl . -create /Users/mikey NFSHomeDirectory /Users/mikey 2>/dev/null || true
          sudo cp -R "/System/Library/User Template/English.lproj" /Users/mikey 2>/dev/null || sudo mkdir -p /Users/mikey
          sudo chown -R mikey:admin /Users/mikey 2>/dev/null || true
          sudo dscl . -passwd /Users/mikey "$PASS" 2>/dev/null || true

          # 4. Add users to admin & remote access groups
          for u in runner mikey; do
            sudo dseditgroup -o edit -a "$u" -t user admin 2>/dev/null || true
            sudo dseditgroup -o edit -a "$u" -t user com.apple.access_screensharing 2>/dev/null || true
            sudo dseditgroup -o edit -a "$u" -t user com.apple.access_ssh 2>/dev/null || true
          done

          # 5. Set Legacy VNC password hash in /Library/Preferences/com.apple.VNCSettings.txt
          echo "$PASS" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null
          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.txt

          # 6. Reset ScreenCapture and configure TCC permissions via MDMOverrides & TCC.db
          sudo tccutil reset ScreenCapture 2>/dev/null || true

          # Create MDMOverrides.plist for tccd
          sudo mkdir -p "/Library/Application Support/com.apple.TCC"
          cat << 'EOF' | sudo tee "/Library/Application Support/com.apple.TCC/MDMOverrides.plist" > /dev/null
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>Services</key>
          	<dict>
          		<key>PostEvent</key>
          		<array>
          			<dict>
          				<key>Allowed</key>
          				<true/>
          				<key>CodeRequirement</key>
          				<string>identifier "com.apple.screensharing.agent" and anchor apple</string>
          				<key>Identifier</key>
          				<string>com.apple.screensharing.agent</string>
          				<key>IdentifierType</key>
          				<string>bundleID</string>
          			</dict>
          			<dict>
          				<key>Allowed</key>
          				<true/>
          				<key>CodeRequirement</key>
          				<string>identifier "com.apple.screensharingd" and anchor apple</string>
          				<key>Identifier</key>
          				<string>com.apple.screensharingd</string>
          				<key>IdentifierType</key>
          				<string>bundleID</string>
          			</dict>
          			<dict>
          				<key>Allowed</key>
          				<true/>
          				<key>CodeRequirement</key>
          				<string>identifier "com.apple.RemoteDesktopAgent" and anchor apple</string>
          				<key>Identifier</key>
          				<string>com.apple.RemoteDesktopAgent</string>
          				<key>IdentifierType</key>
          				<string>bundleID</string>
          			</dict>
          		</array>
          		<key>ScreenCapture</key>
          		<array>
          			<dict>
          				<key>Allowed</key>
          				<true/>
          				<key>CodeRequirement</key>
          				<string>identifier "com.apple.screensharing.agent" and anchor apple</string>
          				<key>Identifier</key>
          				<string>com.apple.screensharing.agent</string>
          				<key>IdentifierType</key>
          				<string>bundleID</string>
          			</dict>
          			<dict>
          				<key>Allowed</key>
          				<true/>
          				<key>CodeRequirement</key>
          				<string>identifier "com.apple.screensharingd" and anchor apple</string>
          				<key>Identifier</key>
          				<string>com.apple.screensharingd</string>
          				<key>IdentifierType</key>
          				<string>bundleID</string>
          			</dict>
          			<dict>
          				<key>Allowed</key>
          				<true/>
          				<key>CodeRequirement</key>
          				<string>identifier "com.apple.RemoteDesktopAgent" and anchor apple</string>
          				<key>Identifier</key>
          				<string>com.apple.RemoteDesktopAgent</string>
          				<key>IdentifierType</key>
          				<string>bundleID</string>
          			</dict>
          		</array>
          	</dict>
          </dict>
          </plist>
          EOF
          sudo chmod 644 "/Library/Application Support/com.apple.TCC/MDMOverrides.plist"

          # Direct TCC.db insertion
          SERVICES=("kTCCServiceScreenCapture" "kTCCServicePostEvent" "kTCCServiceAccessibility" "kTCCServiceListenEvent")
          CLIENTS=("com.apple.screensharing.agent" "com.apple.screensharingd" "com.apple.RemoteDesktopAgent")

          for s in "${SERVICES[@]}"; do
            for c in "${CLIENTS[@]}"; do
              sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
                "INSERT OR REPLACE INTO access VALUES('$s','$c',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,strftime('%s','now'));" 2>/dev/null || true
            done
          done

          for udir in /Users/runner /Users/mikey; do
            sudo mkdir -p "$udir/Library/Application Support/com.apple.TCC"
            for s in "${SERVICES[@]}"; do
              for c in "${CLIENTS[@]}"; do
                sudo sqlite3 "$udir/Library/Application Support/com.apple.TCC/TCC.db" \
                  "INSERT OR REPLACE INTO access VALUES('$s','$c',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,strftime('%s','now'));" 2>/dev/null || true
              done
            done
            sudo chown -R "$(basename "$udir")" "$udir/Library/Application Support/com.apple.TCC" 2>/dev/null || true
          done

          # Restart tccd so new permissions take effect immediately
          sudo killall -9 tccd 2>/dev/null || true

          # 7. Configure and restart ARDAgent / Screen Sharing
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -privs -all \
            -allowAccessFor -allUsers \
            -restart -agent -console

          # 8. Wake display, launch GUI session, and trigger WindowServer rendering
          if [ -f "/Library/Application Support/VMware Tools/vmware-resolutionSet" ]; then
            sudo "/Library/Application Support/VMware Tools/vmware-resolutionSet" 1920 1080 2>/dev/null || true
          fi
          caffeinate -u -t 5 2>/dev/null || true
          sudo -u runner open -a Finder 2>/dev/null || true
          sudo -u runner open -a Terminal 2>/dev/null || true
          sudo -u runner open -a Safari "https://www.google.com" 2>/dev/null || true
          sudo -u runner osascript -e 'tell application "Finder" to activate' 2>/dev/null || true
          sudo -u runner osascript -e 'tell application "System Events" to key code 123' 2>/dev/null || true
          # screencapture forces WindowServer to compose and allocate display buffer
          sudo -u runner screencapture -x /tmp/screen_wake.png 2>/dev/null || true

          # Restart screensharingd to bind to initialized display
          sudo killall -9 screensharingd 2>/dev/null || true

          # 9. Enable SSH
          sudo systemsetup -setremotelogin on 2>/dev/null || true
          echo "[+] System configured, TCC injected, display initialized, and Screen Sharing service restarted"

      # ── 3. Start Tunnel ────────────────────────────────────────────────────
      - name: Start Bore Tunnel
        run: |
          mkdir -p /tmp/logs
          rm -f /tmp/logs/bore.log
          nohup /usr/local/bin/bore local 5900 --to bore.pub > /tmp/logs/bore.log 2>&1 &

          TUNNEL_URL=""
          for i in $(seq 1 25); do
            sleep 2
            if grep -q "bore.pub:[0-9]" /tmp/logs/bore.log 2>/dev/null; then
              TUNNEL_URL=$(grep -oE "bore\.pub:[0-9]+" /tmp/logs/bore.log | head -n 1)
              break
            fi
          done

          if [ -n "$TUNNEL_URL" ]; then
            echo "TUNNEL_HOST=$TUNNEL_URL" >> $GITHUB_ENV
            echo "::add-mask::$TUNNEL_URL"
            echo "============================================"
            echo " [+] macOS VNC Ready : $TUNNEL_URL"
            echo " [+] Password        : $MAC_PASS"
            echo " [+] Username        : mikey"
            if [ -n "$RUNNER_PASS" ]; then
              echo " [+] Runner User Pass: $RUNNER_PASS"
            fi
            echo "============================================"

            echo "### 🍎 macOS Screen Sharing (VNC) Ready" >> $GITHUB_STEP_SUMMARY
            echo "- **VNC Address**: \`$TUNNEL_URL\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Password**: \`$MAC_PASS\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Username (if requested)**: \`mikey\`" >> $GITHUB_STEP_SUMMARY
            if [ -n "$RUNNER_PASS" ]; then
              echo "- **Runner Console User**: \`runner\` (Password: \`$RUNNER_PASS\`)" >> $GITHUB_STEP_SUMMARY
            fi
            echo "- **How to connect**:" >> $GITHUB_STEP_SUMMARY
            echo "  - **Method 1 (Standard VNC - Recommended)**: In RealVNC Viewer, enter \`$TUNNEL_URL\`. When prompted for password, enter \`$MAC_PASS\` (leave Username empty or as default)." >> $GITHUB_STEP_SUMMARY
            echo "  - **Method 2 (Apple Remote Desktop)**: Enter Username: \`mikey\` and Password: \`$MAC_PASS\`." >> $GITHUB_STEP_SUMMARY
            echo "  - **From Mac**: Press \`Cmd + K\` in Finder or Safari and type \`vnc://$TUNNEL_URL\`" >> $GITHUB_STEP_SUMMARY
            echo "  - **From Mobile**: Download **VNC Viewer** app and connect to \`$TUNNEL_URL\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "[!] Failed to get bore tunnel"
            cat /tmp/logs/bore.log 2>/dev/null || true
            exit 1
          fi

      # ── 4. Build and Upload Connection Artifact ────────────────────────────
      - name: Build Connection Info
        run: |
          cat << EOF > macos-vnc-info.txt
          === macOS Remote Desktop (Screen Sharing / VNC) ===
          VNC Address: ${{ env.TUNNEL_HOST }}
          Password: ${{ env.MAC_PASS }}
          Username: mikey
          Runner User: runner
          Connection URL: vnc://${{ env.TUNNEL_HOST }}

          How to connect:
          - Method 1: RealVNC Viewer -> ${{ env.TUNNEL_HOST }} -> Password: ${{ env.MAC_PASS }}
          - Method 2: RealVNC Viewer -> Username: mikey, Password: ${{ env.MAC_PASS }}
          - macOS Finder: Cmd+K -> vnc://${{ env.TUNNEL_HOST }}
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-connection
          path: macos-vnc-info.txt
          retention-days: 1

      # ── 5. Keep Alive Session ──────────────────────────────────────────────
      - name: Keep Alive macOS Session
        run: |
          echo "[+] macOS session live on ${{ env.TUNNEL_HOST }}"
          START_TIME=$(date +%s)
          while true; do
            NOW=$(date +%s)
            ELAPSED=$(( (NOW - START_TIME) / 60 ))
            if [ $ELAPSED -ge 350 ]; then
              echo "[*] 350 min elapsed, session limit reached."
              break
            fi
            echo "[~] ${ELAPSED}m elapsed | macOS VNC Active on ${{ env.TUNNEL_HOST }}"
            sleep 120
          done

      # ── 6. Cleanup ─────────────────────────────────────────────────────────
      - name: Cleanup macOS
        if: always()
        run: |
          pkill -f bore 2>/dev/null || true
