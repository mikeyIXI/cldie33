name: macOS Apple Silicon Cloud Runner

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: 'macOS Version (macos-15 [Sequoia], macos-latest)'
        required: false
        default: 'macos-15'
      password:
        description: 'Password for VNC / SSH'
        required: false
        default: 'Mikey@2026'
      auto_restart:
        description: 'Auto-restart when session ends'
        required: false
        default: 'false'

concurrency:
  group: vexor-macos
  cancel-in-progress: true

jobs:
  macos-runner:
    runs-on: ${{ inputs.macos_version || 'macos-15' }}
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read

    steps:
      # ── 1. Download Bore ───────────────────────────────────────────────────
      - name: Download Bore Tunnel
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-aarch64-apple-darwin.tar.gz" -o bore.tar.gz
          else
            curl -fsSL "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-apple-darwin.tar.gz" -o bore.tar.gz
          fi
          tar -xzf bore.tar.gz
          sudo mv bore /usr/local/bin/bore
          sudo chmod +x /usr/local/bin/bore
          rm -f bore.tar.gz
          echo "[+] Bore installed for $ARCH"

      # ── 2. Configure Password & System ────────────────────────────────────
      - name: Configure User and Remote Access
        env:
          RDP_SECRET_PASS: ${{ secrets.RDP_PASS }}
        run: |
          PASS="${{ inputs.password }}"
          PASS=$(echo "$PASS" | xargs)
          [ -z "$PASS" ] && PASS="${RDP_SECRET_PASS}"
          [ -z "$PASS" ] && PASS="Mikey@2026"
          echo "::add-mask::$PASS"
          echo "MAC_PASS=$PASS" >> $GITHUB_ENV

          # 1. Create dedicated user 'mikey'
          sudo dscl . -create /Users/mikey
          sudo dscl . -create /Users/mikey UserShell /bin/zsh
          sudo dscl . -create /Users/mikey RealName "Mikey"
          sudo dscl . -create /Users/mikey UniqueID 1001
          sudo dscl . -create /Users/mikey PrimaryGroupID 80
          sudo dscl . -create /Users/mikey NFSHomeDirectory /Users/mikey
          sudo cp -R "/System/Library/User Template/English.lproj" /Users/mikey 2>/dev/null || sudo mkdir -p /Users/mikey
          sudo chown -R mikey:admin /Users/mikey 2>/dev/null || true
          sudo dscl . -passwd /Users/mikey "$PASS"

          # 2. Add mikey to admin & remote access groups
          sudo dseditgroup -o edit -a mikey -t user admin 2>/dev/null || true
          sudo dseditgroup -o edit -a mikey -t user com.apple.access_screensharing 2>/dev/null || true
          sudo dseditgroup -o edit -a mikey -t user com.apple.access_ssh 2>/dev/null || true

          # 3. Enable Remote Management & Screen Sharing with kickstart
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$PASS" \
            -users mikey \
            -privs -all \
            -allowAccessFor -allUsers \
            -restart -agent -console

          # 4. Enable auto-login for mikey so desktop session is active
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "mikey" 2>/dev/null || true

          # 5. Enable SSH
          sudo systemsetup -setremotelogin on 2>/dev/null || true
          echo "[+] User 'mikey' created and Screen Sharing configured"

      # ── 3. Start Tunnel ────────────────────────────────────────────────────
      - name: Start Bore Tunnel
        run: |
          mkdir -p /tmp/logs
          rm -f /tmp/logs/bore.log
          nohup /usr/local/bin/bore local 5900 --to bore.pub > /tmp/logs/bore.log 2>&1 &

          TUNNEL_URL=""
          for i in $(seq 1 25); do
            sleep 2
            if grep -q "bore.pub:[0-9]" /tmp/logs/bore.log 2>/dev/null; then
              TUNNEL_URL=$(grep -oE "bore\.pub:[0-9]+" /tmp/logs/bore.log | head -n 1)
              break
            fi
          done

          if [ -n "$TUNNEL_URL" ]; then
            echo "TUNNEL_HOST=$TUNNEL_URL" >> $GITHUB_ENV
            echo "::add-mask::$TUNNEL_URL"
            echo "============================================"
            echo " [+] macOS VNC Ready : $TUNNEL_URL"
            echo " [+] Username        : mikey"
            echo " [+] Password        : $MAC_PASS"
            echo "============================================"

            echo "### 🍎 macOS Screen Sharing (VNC) Ready" >> $GITHUB_STEP_SUMMARY
            echo "- **VNC Address**: \`$TUNNEL_URL\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Username**: \`mikey\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Password**: \`$MAC_PASS\`" >> $GITHUB_STEP_SUMMARY
            echo "- **How to connect**:" >> $GITHUB_STEP_SUMMARY
            echo "  - **From Windows**: Use RealVNC Viewer, TightVNC, or TigerVNC (Address: \`$TUNNEL_URL\`, Username: \`mikey\`, Password: \`$MAC_PASS\`)" >> $GITHUB_STEP_SUMMARY
            echo "  - **From Mac**: Press \`Cmd + K\` in Finder or Safari and type \`vnc://$TUNNEL_URL\`" >> $GITHUB_STEP_SUMMARY
            echo "  - **From iPhone/Android**: Download **VNC Viewer** app from App Store / Google Play" >> $GITHUB_STEP_SUMMARY
          else
            echo "[!] Failed to get bore tunnel"
            cat /tmp/logs/bore.log 2>/dev/null || true
            exit 1
          fi

      # ── 4. Build and Upload Connection Artifact ────────────────────────────
      - name: Build Connection Info
        run: |
          cat << EOF > macos-vnc-info.txt
          === macOS Remote Desktop (Screen Sharing / VNC) ===
          VNC Address: ${{ env.TUNNEL_HOST }}
          Username: mikey
          Password: ${{ env.MAC_PASS }}
          Connection URL: vnc://${{ env.TUNNEL_HOST }}

          How to connect:
          - Windows: RealVNC, TightVNC, TigerVNC (Username: mikey, Password: ${{ env.MAC_PASS }})
          - macOS: Finder -> Go -> Connect to Server (Cmd+K) -> vnc://${{ env.TUNNEL_HOST }}
          - Mobile: VNC Viewer app
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-connection
          path: macos-vnc-info.txt
          retention-days: 1

      # ── 5. Keep Alive Session ──────────────────────────────────────────────
      - name: Keep Alive macOS Session
        run: |
          echo "[+] macOS session live on ${{ env.TUNNEL_HOST }}"
          START_TIME=$(date +%s)
          while true; do
            NOW=$(date +%s)
            ELAPSED=$(( (NOW - START_TIME) / 60 ))
            if [ $ELAPSED -ge 350 ]; then
              echo "[*] 350 min elapsed, session limit reached."
              break
            fi
            echo "[~] ${ELAPSED}m elapsed | macOS VNC Active on ${{ env.TUNNEL_HOST }}"
            sleep 120
          done

      # ── 6. Cleanup ─────────────────────────────────────────────────────────
      - name: Cleanup macOS
        if: always()
        run: |
          pkill -f bore 2>/dev/null || true
