          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --password "$MAC_PASSWORD" 2>&1 | tail -2 || true
          sudo -u "$CONSOLE_USER" /Applications/RustDesk.app/Contents/MacOS/RustDesk --password "$MAC_PASSWORD" 2>&1 | tail -2 || true
          sudo cp -f "$USER_RD_CFG/RustDesk.toml" "$ROOT_RD_CFG/RustDesk.toml" 2>/dev/null || true
          sudo chown -R "$CONSOLE_USER":staff "$USER_RD_CFG" || true

          echo "=== RustDesk Port 21118 Listener ==="
          sudo lsof -nP -iTCP:21118 -sTCP:LISTEN || true

          RD_ID=""
          for i in $(seq 1 15); do
            RD_ID=$(sudo -u "$CONSOLE_USER" /Applications/RustDesk.app/Contents/MacOS/RustDesk --get-id 2>/dev/null | tr -dc '0-9' )
            [ -z "$RD_ID" ] && RD_ID=$(grep -E "^id *=" "$USER_RD_CFG/RustDesk.toml" 2>/dev/null | grep -oE "[0-9]{6,}" )
            [ -n "$RD_ID" ] && break
            sleep 2
          done
          echo "RD_ID=$RD_ID" >> "$GITHUB_ENV"

          # Re-open user GUI apps that were open at the end of the previous 6-hour session
          if [ -f /var/tmp/macos_restored_items.json ]; then
            python3 - "$UIDN" "$CONSOLE_USER" <<'PY' || true
          import json, subprocess, sys
          uidn, user = sys.argv[1], sys.argv[2]
          info = json.load(open("/var/tmp/macos_restored_items.json"))
          for app in info.get("open_apps", []):
              print(f"Re-opening previous session app: {app}")
              subprocess.run(["sudo", "launchctl", "asuser", uidn, "sudo", "-u", user, "open", "-a", app], check=False)
          PY
          fi
          if [ -f "/Users/$CONSOLE_USER/.config/macos-autostart.sh" ]; then
            sudo launchctl asuser "$UIDN" sudo -u "$CONSOLE_USER" /bin/bash "/Users/$CONSOLE_USER/.config/macos-autostart.sh" >/tmp/user_autostart.log 2>&1 &
          fi
          sleep 3
          screencapture -x connection-details/desktop_ready.png || true

      - name: Setup noVNC, Bore & Cloudflare
        run: |
          python3 -m venv /tmp/vncvenv
          /tmp/vncvenv/bin/pip install -q websockify
          retry() { for i in 1 2 3 4 5 6; do "$@" && return 0; echo "retry $i: $*"; sleep 10; done; return 1; }
          get_novnc() { rm -rf /tmp/novnc && git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc; }
          retry get_novnc
          nohup /tmp/vncvenv/bin/websockify --web /tmp/novnc 6080 127.0.0.1:5900 > /tmp/websockify.log 2>&1 &
          for _ in $(seq 1 15); do curl -sf -o /dev/null http://127.0.0.1:6080/vnc.html && break; sleep 2; done

          if [ "$(uname -m)" = "arm64" ]; then B=aarch64; C=arm64; else B=x86_64; C=amd64; fi
          retry sh -c "curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-${B}-apple-darwin.tar.gz | tar -xz"
          retry sh -c "curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-${C}.tgz | tar -xz"
          sudo mv bore cloudflared /usr/local/bin/
          sudo chmod +x /usr/local/bin/bore /usr/local/bin/cloudflared

      - name: Launch Tunnels & Push Telegram Connection Alert
        run: |
          mkdir -p connection-details
          nohup bore local 21118 --to bore.pub > /tmp/bore_rd.log 2>&1 &
          nohup bore local 5900 --to bore.pub > /tmp/bore_vnc.log 2>&1 &
          nohup cloudflared tunnel --protocol http2 --url http://127.0.0.1:6080 > /tmp/cf.log 2>&1 &
          for _ in $(seq 1 40); do
            RD_PORT=$(grep -oE "listening at bore.pub:[0-9]+" /tmp/bore_rd.log | head -1 | cut -d: -f2)
            VNC_PORT=$(grep -oE "listening at bore.pub:[0-9]+" /tmp/bore_vnc.log | head -1 | cut -d: -f2)
            CF_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/cf.log | head -1)
            [ -n "$RD_PORT" ] && [ -n "$VNC_PORT" ] && [ -n "$CF_URL" ] && break
            sleep 1
          done
          BORE_IP=$(python3 -c "import socket; print(socket.gethostbyname('bore.pub'))" 2>/dev/null || echo "bore.pub")
          END_EPOCH=$(( $(date +%s) + 345 * 60 ))
          echo "END_EPOCH=$END_EPOCH" >> "$GITHUB_ENV"
          echo "BORE_IP=$BORE_IP" >> "$GITHUB_ENV"

          RESTORE_MSG="$(cat /var/tmp/restore_summary.txt 2>/dev/null || echo 'جاهز للعمل')"
          CF_FULL="${CF_URL}/vnc.html?autoconnect=true&resize=scale&show_dot=true&quality=5&compression=3"

          python3 - "$BORE_IP" "$RD_PORT" "$VNC_PORT" "$CF_FULL" "$MAC_PASSWORD" "$RD_ID" "$RESTORE_MSG" "$END_EPOCH" <<'PY'
          import json, sys
          data = {
              "rd_addr": f"{sys.argv[1]}:{sys.argv[2]}",
              "rd_port": sys.argv[2],
              "vnc_addr": f"bore.pub:{sys.argv[3]}",
              "cf_full": sys.argv[4],
              "password": sys.argv[5],
              "rd_id": sys.argv[6],
              "restore_msg": sys.argv[7],
              "end_epoch": int(sys.argv[8]),
          }
          with open("/var/tmp/current_conn.json", "w") as f:
              json.dump(data, f)
          PY

          cat > connection-details/CREDENTIALS.md <<EOF
          # Persistent Genuine Apple macOS Cloud Desktop

          ## 0. RustDesk Direct IP (NO ACCOUNT / NO LOGIN NEEDED - FASTEST)
          Enter in Remote ID box: ${BORE_IP}:${RD_PORT}
          (or hostname)         : bore.pub:${RD_PORT}
          Password              : ${MAC_PASSWORD}
          (Optional numeric ID if signed in: ${RD_ID})

          ## 1. Browser (HTTPS, one click)
          ${CF_FULL}

          ## 2. RealVNC Viewer / TigerVNC
          Address : bore.pub:${VNC_PORT}
          Password: ${MAC_PASSWORD}

          State: ${RESTORE_MSG}
          EOF

          # Launch Telegram Bot daemon & log bot connection status
          sudo nohup /usr/local/bin/macos-tg-bot > /tmp/tg_bot.log 2>&1 &
          sleep 6
          echo "=== Telegram Bot Status ===" | tee -a connection-details/diag.log
          cat /tmp/tg_bot.log | tee -a connection-details/diag.log || true

      - name: Upload Connection Details & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-connection-info
          path: connection-details/
          retention-days: 1

      - name: Keep Alive, Periodic 15m Backup & Seamless 6h Auto-Renewal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          UIDN=$(id -u "$CONSOLE_USER")
          LOOPS=0
          CUR_RD_PORT=$(python3 -c 'import json; print(json.load(open("/var/tmp/current_conn.json"))["rd_port"])')

          while [ "$(date +%s)" -lt "$END_EPOCH" ]; do
            [ -f /var/tmp/stop_requested ] && { echo "[*] Stop requested via Telegram."; break; }

            sudo pkill -u mikey -x "Setup Assistant" 2>/dev/null || true
            sudo pkill -u mikey -f "SetupAssistant" 2>/dev/null || true

            if ! sudo lsof -nP -iTCP:21118 -sTCP:LISTEN >/dev/null 2>&1; then
              sudo launchctl kickstart -k "gui/$UIDN/com.carriez.RustDesk_server" 2>/dev/null || true
            fi

            if ! pgrep -f "macos-tg-bot" >/dev/null 2>&1; then
              sudo nohup /usr/local/bin/macos-tg-bot >> /tmp/tg_bot.log 2>&1 &
            fi

            CHANGED=0
            if ! pgrep -f "bore local 21118" > /dev/null; then
              rm -f /tmp/bore_rd.log
              nohup bore local 21118 --to bore.pub > /tmp/bore_rd.log 2>&1 &
              sleep 6
              NEW_RD=$(grep -oE "listening at bore.pub:[0-9]+" /tmp/bore_rd.log | head -1 | cut -d: -f2)
              if [ -n "$NEW_RD" ] && [ "$NEW_RD" != "$CUR_RD_PORT" ]; then
                CUR_RD_PORT="$NEW_RD"
                CHANGED=1
              fi
            fi

            if ! pgrep -f "bore local 5900" > /dev/null; then
              nohup bore local 5900 --to bore.pub >> /tmp/bore_vnc.log 2>&1 &
            fi

            if ! pgrep -f "cloudflared tunnel" > /dev/null; then
              nohup cloudflared tunnel --protocol http2 --url http://127.0.0.1:6080 > /tmp/cf.log 2>&1 &
              sleep 10
              CHANGED=1
            fi

            if [ "$CHANGED" -eq 1 ]; then
              CF_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/cf.log | tail -1)
              python3 - "$BORE_IP" "$CUR_RD_PORT" "$CF_URL" <<'PY' || true
          import json, sys, time
          c = json.load(open("/var/tmp/current_conn.json"))
          c["rd_port"] = sys.argv[2]
          c["rd_addr"] = f"{sys.argv[1]}:{sys.argv[2]}"
          if sys.argv[3]:
              c["cf_full"] = f"{sys.argv[3]}/vnc.html?autoconnect=true&resize=scale&show_dot=true&quality=5&compression=3"
          json.dump(c, open("/var/tmp/current_conn.json", "w"))
          msg = (
              f"🔔 <b>تم تحديث بورت الاتصال تلقائيًا:</b>\n"
              f"• RustDesk ID: <code>{c['rd_addr']}</code>\n"
              f"• Password: <code>{c['password']}</code>\n"
              f"• Browser: {c['cf_full']}"
          )
          open(f"/var/tmp/notify_queue/{int(time.time())}_port.txt", "w").write(msg)
          PY
            fi

            sleep 60
            LOOPS=$((LOOPS + 1))

            # Periodic background snapshot every 15 minutes
            if [ $((LOOPS % 15)) -eq 0 ] && [ ! -f /var/tmp/stop_requested ]; then
              sudo /usr/local/bin/macos-state-tool backup periodic || true
            fi
          done

          # Seamless 6-hour handover when timer reaches 345 minutes
          if [ ! -f /var/tmp/stop_requested ]; then
            cat > "/var/tmp/notify_queue/$(date +%s)_handover.txt" <<'EOF'
          🔄 <b>جاري التجديد التلقائي لدورة الـ 6 ساعات الجديدة...</b>
          تم حفظ جميع ملفاتك وتطبيقاتك وجلسات المتصفح بالكامل، وهيوصلك الـ IP الجديد هنا خلال دقيقتين تلقائيًا!
          EOF
            sleep 5
            sudo /usr/local/bin/macos-state-tool backup handover || true
            sudo touch /var/tmp/handover_saved
            gh workflow run macos.yml -R "$GH_REPO" --ref "${GITHUB_REF_NAME:-main}" 2>/dev/null || true
          fi

      - name: Final Emergency State Save (On Manual Restart / Cancel)
        if: always()
        run: |
          if [ -f /var/tmp/baseline_done ] && [ ! -f /var/tmp/handover_saved ]; then
            echo "[*] Saving final state snapshot before runner shutdown..."
            sudo /usr/local/bin/macos-state-tool backup final || true
          fi
