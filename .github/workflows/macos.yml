          sudo launchctl bootout "gui/$UIDN/com.carriez.RustDesk_server" 2>/dev/null || true
          sudo launchctl bootstrap "gui/$UIDN" /Library/LaunchAgents/com.carriez.RustDesk_server.plist 2>/dev/null || sudo launchctl asuser "$UIDN" sudo -u "$CONSOLE_USER" launchctl load -w /Library/LaunchAgents/com.carriez.RustDesk_server.plist || true
