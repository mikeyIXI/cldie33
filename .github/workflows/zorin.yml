name: Zorin OS Cloud RDP (XRDP + Bore)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password for RDP (default: Mikey@2026)'
        required: false
        default: 'Mikey@2026'
      auto_restart:
        description: 'Auto-restart workflow before timeout (6h)'
        required: false
        type: boolean
        default: false

concurrency:
  group: vexor-zorin
  cancel-in-progress: true

jobs:
  zorin-rdp:
    name: Run Zorin OS Desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zorin OS Desktop Environment & XRDP
        env:
          RDP_PASSWORD: ${{ inputs.password || 'Mikey@2026' }}
        run: |
          set -e
          echo "======================================================"
          echo " Installing Zorin OS Desktop (XFCE + Zorin Theme) + XRDP"
          echo "======================================================"

          # Prevent interactive prompts
          export DEBIAN_FRONTEND=noninteractive

          # Disable any conflicting remote desktop services
          sudo systemctl stop gnome-remote-desktop 2>/dev/null || true
          sudo systemctl disable gnome-remote-desktop 2>/dev/null || true
          sudo systemctl mask gnome-remote-desktop 2>/dev/null || true

          # Update apt
          sudo apt-get update -y

          # Install XRDP, TigerVNC (Xvnc virtual framebuffer backend), XFCE4 desktop and essential tools
          sudo apt-get install -y --no-install-recommends \
            xrdp \
            xorgxrdp \
            tigervnc-standalone-server \
            tigervnc-common \
            xserver-xorg-core \
            xserver-xorg-video-dummy \
            xfce4 \
            xfce4-goodies \
            xfce4-terminal \
            xfce4-whiskermenu-plugin \
            xfce4-pulseaudio-plugin \
            pavucontrol \
            dbus-x11 \
            x11-xserver-utils \
            fonts-ubuntu \
            firefox \
            curl \
            wget \
            git \
            jq \
            unzip \
            tar \
            htop \
            nano

          # Download and install bore tunnel client
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin bore
          sudo chmod +x /usr/local/bin/bore

          # Install official Zorin OS Desktop & Icon themes
          echo "[*] Downloading official Zorin OS themes & icons..."
          git clone --depth 1 https://github.com/ZorinOS/zorin-desktop-themes.git /tmp/zorin-themes || true
          if [ -d "/tmp/zorin-themes" ]; then
            sudo cp -r /tmp/zorin-themes/ZorinBlue-Dark* /usr/share/themes/ || true
            sudo cp -r /tmp/zorin-themes/ZorinBlue-Light* /usr/share/themes/ || true
          fi

          git clone --depth 1 https://github.com/ZorinOS/zorin-icon-themes.git /tmp/zorin-icons || true
          if [ -d "/tmp/zorin-icons" ]; then
            sudo cp -r /tmp/zorin-icons/Zorin* /usr/share/icons/ || true
            sudo gtk-update-icon-cache /usr/share/icons/Zorin || true
            sudo gtk-update-icon-cache /usr/share/icons/ZorinBlue-Dark || true
            
            # Extract Zorin logo for Whisker Menu button
            sudo mkdir -p /usr/share/pixmaps
            if [ -f "/tmp/zorin-icons/Zorin/48x48/places/start-here.png" ]; then
              sudo cp /tmp/zorin-icons/Zorin/48x48/places/start-here.png /usr/share/pixmaps/zorin-menu.png
              sudo cp /tmp/zorin-icons/Zorin/48x48/places/start-here.png /usr/share/pixmaps/zorin-logo.png
            fi
          fi

          # Download official Zorin OS Mountain Wallpapers
          echo "[*] Downloading official Zorin OS wallpapers..."
          sudo mkdir -p /usr/share/backgrounds/zorin /usr/share/backgrounds/xfce
          sudo curl -sL "https://raw.githubusercontent.com/saint-13/Linux_Dynamic_Wallpapers/main/Dynamic_Wallpapers/ZorinMountain/Night.jpg" -o /usr/share/backgrounds/zorin/zorin-mountain.jpg
          sudo curl -sL "https://raw.githubusercontent.com/saint-13/Linux_Dynamic_Wallpapers/main/Dynamic_Wallpapers/ZorinMountain/Day.jpg" -o /usr/share/backgrounds/zorin/zorin-mountain-day.jpg
          # Overwrite default XFCE wallpapers so any default/fallback screen shows Zorin OS wallpaper
          sudo cp /usr/share/backgrounds/zorin/zorin-mountain.jpg /usr/share/backgrounds/xfce/xfce-teal.jpg || true
          sudo cp /usr/share/backgrounds/zorin/zorin-mountain.jpg /usr/share/backgrounds/xfce/xfce-blue.jpg || true
          sudo cp /usr/share/backgrounds/zorin/zorin-mountain.jpg /usr/share/backgrounds/xfce/xfce-stripes.png || true

          # Setup users: 'mikey' and 'runner'
          echo "[*] Setting up users..."
          if ! id "mikey" &>/dev/null; then
            sudo useradd -m -s /bin/bash -G sudo,adm,audio,video mikey
          fi
          echo "mikey:$RDP_PASSWORD" | sudo chpasswd
          echo "runner:$RDP_PASSWORD" | sudo chpasswd

          # Sudoers without password
          echo "mikey ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/mikey
          echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/runner

          # Fix XRDP permissions
          sudo adduser xrdp ssl-cert || true
          sudo adduser mikey ssl-cert || true
          sudo adduser runner ssl-cert || true

          # Configure polkit to suppress authentication popups inside RDP session
          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d/
          sudo tee /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla << 'EOF'
          [Allow Colord all Users]
          Identity=unix-user:*
          Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
          ResultAny=no
          ResultInactive=no
          ResultActive=yes

          [Allow PackageKit all Users]
          Identity=unix-user:*
          Action=org.freedesktop.packagekit.system-sources-refresh;org.freedesktop.packagekit.system-network-proxy-configure
          ResultAny=no
          ResultInactive=no
          ResultActive=yes
          EOF

          # Configure ~/.xsession with dynamic wallpaper setter
          for u in mikey runner; do
            UHOME="/home/$u"
            cat << 'XSES' | sudo tee "$UHOME/.xsession"
          #!/bin/bash
          # Dynamic wallpaper setter on session start
          (
            sleep 2
            for prop in $(xfconf-query -c xfce4-desktop -l 2>/dev/null | grep -E "last-image|image-path"); do
              xfconf-query -c xfce4-desktop -p "$prop" -s /usr/share/backgrounds/zorin/zorin-mountain.jpg 2>/dev/null || true
            done
            xfdesktop --reload 2>/dev/null || true
          ) &
          exec xfce4-session
          XSES
            sudo chmod 755 "$UHOME"
            sudo chmod +x "$UHOME/.xsession"
            sudo chown -R $u:$u "$UHOME"
          done

          # Configure /etc/xrdp/startwm.sh
          cat << 'EOF' | sed 's/^[ \t]*//' | sudo tee /etc/xrdp/startwm.sh
          #!/bin/sh
          if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG LANGUAGE
          fi

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          test -x /etc/X11/Xsession && exec /etc/X11/Xsession
          exec /bin/sh /etc/X11/Xsession
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh

          # Allow anybody to start Xorg
          echo "allowed_users=anybody" | sudo tee /etc/X11/Xwrapper.config
          sudo chmod 644 /etc/X11/Xwrapper.config

          # Configure xrdp.ini: make Xvnc first so it defaults to rock-solid headless virtual display
          sudo python3 -c "
          with open('/etc/xrdp/xrdp.ini', 'r') as f:
              content = f.read()
          # If [Xvnc] is present, move it before [Xorg]
          if '[Xvnc]' in content and '[Xorg]' in content:
              parts = content.split('[Xorg]')
              pre_xorg = parts[0]
              post_xorg = '[Xorg]' + parts[1]
              vnc_parts = post_xorg.split('[Xvnc]')
              vnc_section = '[Xvnc]' + vnc_parts[1].split('\n\n[')[0]
              rest_after_vnc = post_xorg.replace(vnc_section, '')
              new_content = pre_xorg + vnc_section + '\n\n' + rest_after_vnc
              with open('/etc/xrdp/xrdp.ini', 'w') as f:
                  f.write(new_content)
          "

          # Set XRDP port and buffer settings
          sudo sed -i 's/port=3389/port=3389/g' /etc/xrdp/xrdp.ini
          sudo sed -i 's/max_bpp=32/max_bpp=24/g' /etc/xrdp/xrdp.ini
          sudo sed -i 's/crypt_level=high/crypt_level=low/g' /etc/xrdp/xrdp.ini

          # Create Zorin OS Panel and Desktop configurations
          sudo mkdir -p /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml
          sudo mkdir -p /etc/skel/.config/xfce4/panel
          sudo mkdir -p /etc/xdg/xfce4/xfconf/xfce-perchannel-xml

          cat << 'PANELXML' | sudo tee /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-panel" version="1.0">
            <property name="configver" type="int" value="2"/>
            <property name="panels" type="array">
              <value type="int" value="1"/>
              <property name="panel-1" type="empty">
                <property name="position" type="string" value="p=8;x=0;y=0"/>
                <property name="length" type="uint" value="100"/>
                <property name="position-locked" type="bool" value="true"/>
                <property name="size" type="uint" value="40"/>
                <property name="plugin-ids" type="array">
                  <value type="int" value="1"/>
                  <value type="int" value="2"/>
                  <value type="int" value="3"/>
                  <value type="int" value="4"/>
                  <value type="int" value="5"/>
                  <value type="int" value="6"/>
                  <value type="int" value="7"/>
                </property>
                <property name="background-style" type="uint" value="0"/>
                <property name="length-adjust" type="bool" value="true"/>
                <property name="span-monitors" type="bool" value="false"/>
                <property name="mode" type="uint" value="0"/>
                <property name="autohide-behavior" type="uint" value="0"/>
                <property name="disable-struts" type="bool" value="false"/>
              </property>
            </property>
            <property name="plugins" type="empty">
              <property name="plugin-1" type="string" value="whiskermenu">
                <property name="button-icon" type="string" value="/usr/share/pixmaps/zorin-menu.png"/>
                <property name="show-button-title" type="bool" value="false"/>
                <property name="show-button-icon" type="bool" value="true"/>
              </property>
              <property name="plugin-2" type="string" value="tasklist">
                <property name="flat-buttons" type="bool" value="true"/>
                <property name="show-labels" type="bool" value="true"/>
                <property name="grouping" type="uint" value="1"/>
                <property name="show-handle" type="bool" value="false"/>
                <property name="sort-order" type="uint" value="0"/>
              </property>
              <property name="plugin-3" type="string" value="separator">
                <property name="style" type="uint" value="0"/>
                <property name="expand" type="bool" value="true"/>
              </property>
              <property name="plugin-4" type="string" value="systray">
                <property name="show-frame" type="bool" value="false"/>
                <property name="size-max" type="uint" value="24"/>
                <property name="square-icons" type="bool" value="true"/>
              </property>
              <property name="plugin-5" type="string" value="pulseaudio">
                <property name="enable-keyboard-shortcuts" type="bool" value="true"/>
              </property>
              <property name="plugin-6" type="string" value="clock">
                <property name="digital-layout" type="uint" value="3"/>
                <property name="digital-time-format" type="string" value="%l:%M %p"/>
                <property name="mode" type="uint" value="2"/>
              </property>
              <property name="plugin-7" type="string" value="showdesktop"/>
            </property>
          </channel>
          PANELXML

          cat << 'WHISKER' | sudo tee /etc/skel/.config/xfce4/panel/whiskermenu-1.rc
          favorites=firefox.desktop,xfce4-terminal.desktop,thunar.desktop
          recent=
          button-title=Start
          button-icon=/usr/share/pixmaps/zorin-menu.png
          button-single-row=false
          show-button-title=false
          show-button-icon=true
          launcher-show-name=true
          launcher-show-description=true
          launcher-show-tooltip=true
          item-icon-size=2
          hover-switch-category=false
          category-icon-size=1
          load-hierarchy=false
          recent-items-max=10
          favorites-in-recent=true
          display-recent-default=false
          position-search-alternate=false
          position-commands-alternate=false
          position-categories-alternate=false
          menu-width=430
          menu-height=560
          menu-opacity=95
          command-settings=xfce4-settings-manager
          show-command-settings=true
          command-lockscreen=xflock4
          show-command-lockscreen=true
          command-switchuser=gdmflexiserver
          show-command-switchuser=true
          command-logout=xfce4-session-logout
          show-command-logout=true
          WHISKER

          cat << 'DESKXML' | sudo tee /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-desktop" version="1.0">
            <property name="backdrop" type="empty">
              <property name="screen0" type="empty">
                <property name="monitor0" type="empty">
                  <property name="image-path" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  <property name="last-image" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  <property name="workspace0" type="empty">
                    <property name="color-style" type="int" value="0"/>
                    <property name="image-style" type="int" value="5"/>
                    <property name="last-image" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  </property>
                </property>
                <property name="monitorVirtual1" type="empty">
                  <property name="image-path" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  <property name="last-image" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  <property name="workspace0" type="empty">
                    <property name="color-style" type="int" value="0"/>
                    <property name="image-style" type="int" value="5"/>
                    <property name="last-image" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  </property>
                </property>
                <property name="monitorVNC-0" type="empty">
                  <property name="image-path" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  <property name="last-image" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  <property name="workspace0" type="empty">
                    <property name="color-style" type="int" value="0"/>
                    <property name="image-style" type="int" value="5"/>
                    <property name="last-image" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  </property>
                </property>
                <property name="monitorscreen" type="empty">
                  <property name="image-path" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  <property name="last-image" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  <property name="workspace0" type="empty">
                    <property name="color-style" type="int" value="0"/>
                    <property name="image-style" type="int" value="5"/>
                    <property name="last-image" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  </property>
                </property>
                <property name="monitorrdp0" type="empty">
                  <property name="image-path" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  <property name="last-image" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  <property name="workspace0" type="empty">
                    <property name="color-style" type="int" value="0"/>
                    <property name="image-style" type="int" value="5"/>
                    <property name="last-image" type="string" value="/usr/share/backgrounds/zorin/zorin-mountain.jpg"/>
                  </property>
                </property>
              </property>
            </property>
          </channel>
          DESKXML

          cat << 'XSET' | sudo tee /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xsettings" version="1.0">
            <property name="Net" type="empty">
              <property name="ThemeName" type="string" value="ZorinBlue-Dark"/>
              <property name="IconThemeName" type="string" value="ZorinBlue-Dark"/>
              <property name="CursorThemeName" type="string" value="DMZ-White"/>
              <property name="EnableEventSounds" type="bool" value="false"/>
              <property name="EnableInputFeedbackSounds" type="bool" value="false"/>
            </property>
            <property name="Gtk" type="empty">
              <property name="FontName" type="string" value="Ubuntu 10"/>
              <property name="MonospaceFontName" type="string" value="Monospace 10"/>
              <property name="CursorThemeName" type="string" value="DMZ-White"/>
              <property name="CursorThemeSize" type="int" value="24"/>
              <property name="DecorationLayout" type="string" value="close,maximize,minimize:"/>
            </property>
          </channel>
          XSET

          cat << 'XFWM' | sudo tee /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfwm4" version="1.0">
            <property name="general" type="empty">
              <property name="theme" type="string" value="ZorinBlue-Dark"/>
              <property name="title_font" type="string" value="Ubuntu Bold 10"/>
              <property name="button_layout" type="string" value="O|HMC"/>
              <property name="box_move" type="bool" value="false"/>
              <property name="box_resize" type="bool" value="false"/>
              <property name="use_compositing" type="bool" value="false"/>
            </property>
          </channel>
          XFWM

          # Copy system-wide defaults to /etc/xdg
          sudo cp -r /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/* /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/ 2>/dev/null || true

          # Apply configs to both 'mikey' and 'runner'
          for u in mikey runner; do
            UHOME="/home/$u"
            sudo mkdir -p "$UHOME/.config/xfce4/xfconf/xfce-perchannel-xml"
            sudo mkdir -p "$UHOME/.config/xfce4/panel"
            sudo cp -r /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/* "$UHOME/.config/xfce4/xfconf/xfce-perchannel-xml/"
            sudo cp /etc/skel/.config/xfce4/panel/whiskermenu-1.rc "$UHOME/.config/xfce4/panel/"

            # Create desktop shortcuts for Firefox & Terminal
            sudo mkdir -p "$UHOME/Desktop"
            if [ -f "/usr/share/applications/firefox.desktop" ]; then
              sudo cp /usr/share/applications/firefox.desktop "$UHOME/Desktop/"
              sudo chmod +x "$UHOME/Desktop/firefox.desktop"
            fi
            if [ -f "/usr/share/applications/xfce4-terminal.desktop" ]; then
              sudo cp /usr/share/applications/xfce4-terminal.desktop "$UHOME/Desktop/"
              sudo chmod +x "$UHOME/Desktop/xfce4-terminal.desktop"
            fi

            sudo chown -R $u:$u "$UHOME"
          done

          # Restart XRDP services
          sudo systemctl daemon-reload
          sudo systemctl restart xrdp-sesman xrdp
          sudo systemctl enable xrdp xrdp-sesman

          echo "[*] XRDP service started and listening on port 3389."

      - name: Start Bore Tunnel & Expose RDP
        id: tunnel
        run: |
          echo "[*] Starting Bore reverse tunnel on port 3389..."
          
          # Launch bore in a persistent loop in the background
          cat << 'EOF' > /tmp/run_bore.sh
          #!/bin/bash
          while true; do
            bore local 3389 --to bore.pub >> /tmp/bore.log 2>&1
            sleep 2
          done
          EOF
          chmod +x /tmp/run_bore.sh
          nohup /tmp/run_bore.sh > /dev/null 2>&1 &

          # Wait for bore to establish tunnel and capture port
          TUNNEL=""
          for i in {1..25}; do
            sleep 2
            if [ -f /tmp/bore.log ]; then
              PORT=$(grep -oE "listening at bore\.pub:[0-9]+" /tmp/bore.log | tail -n1 | cut -d':' -f2)
              if [ -n "$PORT" ]; then
                TUNNEL="bore.pub:$PORT"
                echo "Found bore tunnel: $TUNNEL"
                break
              fi
            fi
            echo "Waiting for bore tunnel (attempt $i/25)..."
          done

          if [ -z "$TUNNEL" ]; then
            echo "[!] Failed to get bore tunnel. Bore log:"
            cat /tmp/bore.log || true
            exit 1
          fi

          echo "TUNNEL_ADDRESS=$TUNNEL" >> $GITHUB_ENV
          echo "tunnel=$TUNNEL" >> $GITHUB_OUTPUT

          # Prepare Connection Card in Summary
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 Zorin OS Cloud RDP Ready!

          | Item | Value |
          |---|---|
          | **OS** | Zorin OS (XFCE4 Dark Theme) |
          | **RDP Address** | \`$TUNNEL\` |
          | **Primary Username** | \`mikey\` |
          | **Fallback Username** | \`runner\` |
          | **Password** | \`${{ inputs.password || 'Mikey@2026' }}\` |
          | **Client App** | Windows Remote Desktop (\`mstsc.exe\`) |

          ### 📌 How to Connect:
          1. Press **Win + R**, type **\`mstsc\`**, and press Enter.
          2. In the Computer field, enter: **\`$TUNNEL\`**
          3. Click **Connect**.
          4. When prompted, enter Username: **\`mikey\`** and Password: **\`${{ inputs.password || 'Mikey@2026' }}\`**
          5. Enjoy your fast Zorin OS desktop!
          EOF

          # Create artifact file
          mkdir -p ./rdp_info
          cat << EOF > ./rdp_info/connection.txt
          ZORIN OS CLOUD RDP CONNECTION DETAILS
          =======================================
          RDP Host/Address: $TUNNEL
          Username:         mikey
          Alternative User: runner
          Password:         ${{ inputs.password || 'Mikey@2026' }}
          Protocol:         RDP (Standard Remote Desktop)
          Client:           mstsc.exe (Windows Remote Desktop Connection)
          =======================================
          EOF

          echo "============================================"
          echo " [+] RDP IS LIVE AT: $TUNNEL"
          echo " [+] User          : mikey"
          echo " [+] Password      : ${{ inputs.password || 'Mikey@2026' }}"
          echo "============================================"

      - name: Upload Connection Details Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zorin-RDP-Details
          path: ./rdp_info/connection.txt

      - name: Keep-Alive Loop (Up to 6 Hours)
        run: |
          echo "[*] Server is now running. Press Ctrl+C or cancel workflow to stop."
          START_TIME=$(date +%s)
          # Run for 345 minutes (approx 5.75 hours)
          MAX_SECONDS=$(( 345 * 60 ))

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$(( CURRENT_TIME - START_TIME ))
            REMAINING=$(( MAX_SECONDS - ELAPSED ))
            
            if [ $REMAINING -le 0 ]; then
              echo "[*] Max execution time reached. Exiting."
              break
            fi

            MINS_LEFT=$(( REMAINING / 60 ))
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] RDP Active: $TUNNEL_ADDRESS | Time remaining: ${MINS_LEFT} minutes"
            
            # Check if XRDP is still alive
            if ! systemctl is-active --quiet xrdp; then
              echo "[!] Warning: XRDP not active, restarting..."
              sudo systemctl restart xrdp || true
            fi

            sleep 60
          done

      - name: Auto-Restart Workflow
        if: ${{ inputs.auto_restart == true && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Triggering automatic restart of Zorin OS workflow..."
          gh workflow run zorin.yml -f password="${{ inputs.password || 'Mikey@2026' }}" -f auto_restart=true || true
